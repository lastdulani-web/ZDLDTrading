<!doctype html><html lang="en" class="boot"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#505b6a"><link rel="manifest" href="manifest.json"><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ZD&amp;LD"><title>ZD&amp;LD Trading</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d232b;--mute:#5f6a78;--gold:#a57c00;--btn:#505b6a;--onbtn:#fff;--bad:#b3402a;--line:#dde1e6}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14181d;--card:#1d242c;--ink:#e9ecef;--mute:#9aa5b1;--gold:#d9ab1c;--btn:#d9ab1c;--onbtn:#1a1500;--bad:#ff8a70;--line:#2d3641}}
:root[data-theme=dark]{--bg:#14181d;--card:#1d242c;--ink:#e9ecef;--mute:#9aa5b1;--gold:#d9ab1c;--btn:#d9ab1c;--onbtn:#1a1500;--bad:#ff8a70;--line:#2d3641}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header{background:#505b6a;color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 16px;position:relative;display:flex;gap:10px;align-items:center}
header:after{content:"";position:absolute;inset:auto 0 0;height:4px;background:#a57c00}
.lg{background:#fff;border-radius:10px;width:42px;height:42px;display:grid;place-items:center}.lg img{width:36px}
h1{margin:0;font-size:clamp(16px,5vw,20px);flex:1;white-space:nowrap}h1 span{color:#e0b13a}#st{display:grid;place-items:center;padding:6px;color:#fff}@keyframes rot{to{transform:rotate(360deg)}}.spin{animation:rot 1s linear infinite}.hb{background:none;border:0;color:#fff;padding:6px;display:grid;place-items:center;border-radius:10px}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0}
input,select,textarea{display:block;width:100%;font:inherit;padding:10px;margin-top:4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px;border-radius:8px}
button.big{width:100%;margin-top:8px;padding:13px;background:var(--btn);border-color:var(--btn);color:var(--onbtn);font-weight:600}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
small{display:block;color:var(--mute);font-size:13px}.low{color:var(--bad);font-weight:600}
h3{margin:18px 0 4px;font-size:15px}.empty{color:var(--mute);font-size:14px}
.n{font-size:40px;font-weight:700;color:var(--gold)}.neg{color:var(--bad)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}.g div{border-top:2px solid var(--gold);padding-top:6px}.g b{font-size:18px}
.seg{display:flex;gap:6px;margin-bottom:14px}.seg button{flex:1;padding:8px 2px;font-size:13px}
.seg .on{background:var(--btn);color:var(--onbtn);border-color:var(--btn)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;border-radius:0;padding:9px 0 6px;background:none;font-weight:600;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute)}.ni{position:relative;display:grid}.ni i{position:absolute;top:-5px;right:-10px;background:#c0392b;color:#fff;font:700 10px/1 system-ui;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}
nav .on{color:var(--btn);box-shadow:inset 0 3px var(--gold)}
#t{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.2s;pointer-events:none}#t.s{opacity:1}
html.boot{background:#a57c00}@keyframes fi{from{opacity:0}}#sp{position:fixed;inset:0;background:#a57c00;display:grid;place-items:center;z-index:9;transition:opacity .4s}#sp div{display:flex;flex-direction:column;align-items:center;gap:14px;animation:fi .3s ease both}#sp.h{opacity:0}#sp img{width:min(35vw,160px)}#sp p{margin:0;color:#fff;font-size:12px;letter-spacing:.4px}
.oe{padding:12px 0;border-bottom:1px solid var(--line)}.oe .r1,.oe .r2{display:flex;justify-content:space-between;align-items:center;gap:10px}.oe .r2{margin-top:8px}.ic{border:0;background:none;padding:6px;color:var(--mute);display:inline-grid}.ic.d{color:var(--bad)}.ex{display:flex;gap:8px;justify-content:flex-end;margin:8px 0}button.sm{padding:6px 12px;font-size:13px;font-weight:600;background:var(--btn);border-color:var(--btn);color:var(--onbtn)}button.add{width:100%;margin-bottom:14px;padding:13px;border:0;border-radius:10px;background:#d9ab1c;color:#1a1500;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 1px 0 rgba(0,0,0,.18)}.add b{font-size:22px;line-height:1}.tg{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin:5px 6px 0 0;border:1px solid var(--line);color:var(--mute)}.tg.o{border-color:var(--gold);color:var(--btn)}.tg.d{border-color:var(--btn);color:var(--btn)}.tg.b{border-color:var(--bad);color:var(--bad)}.tg.p{background:var(--btn);border-color:var(--btn);color:var(--onbtn)}button.sm2{padding:6px 10px;font-size:13px;margin-right:6px}#rep{display:none}
@media print{body>*:not(#rep){display:none!important}#rep{display:block!important}body{background:#fff;color:#000;padding:0}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #999;padding:4px;text-align:left}th{background:#505b6a;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
